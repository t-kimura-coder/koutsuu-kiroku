<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="走行距離">
<title>走行距離メモ</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div id="loadingView" class="loadingView">
  <img src="hero-illustration.png" class="loadingHeroImg" alt="">
  <div class="loadingTitle">走行距離メモ</div>
  <div class="spinner"></div>
  <div class="loadingText">読み込み中...</div>
</div>

<div id="homeView" class="view" hidden>
  <header class="homeHeader">
    <div class="homeLogoWrap">
      <img src="logo-lockup.png" class="homeLogoLockup logoLight" alt="走行記録">
      <img src="logo-lockup-dark.png" class="homeLogoLockup logoDark" alt="走行記録">
    </div>
    <div class="homeHeaderActions">
      <button id="themeToggleBtn" class="navBtn" aria-label="テーマ切替"></button>
      <button id="goToSettingsFromHomeBtn" class="navBtn" aria-label="設定"></button>
    </div>
  </header>

  <div class="homeBody">
    <img src="hero-illustration.png" class="homeHeroImg" alt="">

    <div class="homeStats">
      <div class="homeStatCard">
        <div class="homeStatIcon" id="homeStatIconRoad"></div>
        <div class="homeStatLabel">本日の走行距離</div>
        <div class="homeStatValue" id="homeStatToday">- km</div>
      </div>
      <div class="homeStatCard">
        <div class="homeStatIcon" id="homeStatIconCal"></div>
        <div class="homeStatLabel">今月の走行距離</div>
        <div class="homeStatValue" id="homeStatMonth">- km</div>
      </div>
      <button id="homeVehicleBtn" class="homeStatCard homeVehicleCard">
        <div class="homeStatIcon" id="homeStatIconCar"></div>
        <div class="homeStatLabel">登録車両</div>
        <div class="homeStatValue homeStatValueSmall" id="homeVehicleSummary">未設定</div>
      </button>
    </div>

    <button id="startTodayBtn" class="homeMenuBtn">
      <span class="homeMenuIcon" id="homeMenuPlayIcon"></span>
      <span class="homeMenuDivider"></span>
      <span class="homeMenuText">
        記録開始
        <span class="homeMenuSub">今日の走行を記録します</span>
      </span>
    </button>

    <div class="homeSecondaryRow">
      <button id="goToListBtn" class="homeSecondaryBtn">
        <span class="homeSecondaryIcon" id="homeListIcon"></span>今月の記録
      </button>
      <button id="homeExportBtn" class="homeSecondaryBtn">
        <span class="homeSecondaryIcon" id="homeSendIcon"></span>今月分を送信
      </button>
    </div>

    <div id="homeReminder" class="homeReminder"></div>
  </div>

  <nav class="bottomTabs">
    <button class="bottomTabBtn active" data-target="home"><span class="bottomTabIcon" id="tabIconHome1"></span>ホーム</button>
    <button class="bottomTabBtn" data-target="vehicle"><span class="bottomTabIcon" id="tabIconVehicle1"></span>車両管理</button>
    <button class="bottomTabBtn" data-target="options"><span class="bottomTabIcon" id="tabIconOptions1"></span>オプション</button>
    <button class="bottomTabBtn" data-target="other"><span class="bottomTabIcon" id="tabIconOther1"></span>その他</button>
  </nav>
</div>

<div id="listView" class="view" hidden>
  <header class="topbar">
    <button id="homeFromListBtn" class="navBtn" aria-label="ホーム">🏠</button>
    <button id="prevPeriod" class="navBtn" aria-label="前の期間">◀</button>
    <div class="periodLabel" id="periodLabelBtn" role="button">
      <div><span id="periodTitle">-</span> <span class="periodJumpHint">▾</span></div>
      <div id="periodName" class="sub">氏名未設定</div>
    </div>
    <button id="openSettingsBtn" class="navBtn" aria-label="設定"></button>
    <button id="nextPeriod" class="navBtn" aria-label="次の期間">▶</button>
  </header>

  <div id="periodJumpPanel" class="periodJumpPanel" hidden>
    <select id="jumpYearSelect"></select>
    <select id="jumpMonthSelect"></select>
    <button id="jumpGoBtn" class="ghostBtn jumpGoBtn">移動</button>
    <button id="jumpTodayBtn" class="ghostBtn jumpTodayBtn">今月</button>
  </div>

  <div id="dayList" class="dayList"></div>

  <footer class="bottombar">
    <button id="exportBtn" class="ghostBtn">📤 今月分をメールで送信</button>
    <div class="exportHintRow">
      <span id="exportHintText" class="exportHint">送信先: 未設定（設定画面で入力してください）</span>
      <button id="copyEmailBtn" class="copyEmailBtn">📋 コピー</button>
    </div>
  </footer>
</div>

<div id="settingsView" class="view" hidden>
  <header class="topbar">
    <button id="settingsHomeBtn" class="navBtn" aria-label="ホーム"></button>
    <div class="periodLabel">
      <div id="settingsSectionTitle">車両管理</div>
    </div>
    <div style="width:2.5em"></div>
  </header>

  <div class="detailBody">
    <div class="settingsPanel" data-panel="vehicle">
      <img src="vehicle-illustration.png" class="vehiclePanelImg" alt="">

      <label class="field">
        <span>氏名<span class="requiredBadge">必須</span></span>
        <input type="text" id="nameInput" placeholder="例）山田 太郎">
      </label>

      <label class="field">
        <span>年式</span>
        <select id="vehicleYearInput"></select>
      </label>
      <label class="field">
        <span>車種</span>
        <input type="text" id="vehicleModelInput" placeholder="例）カローラフィールダー">
      </label>
      <label class="field">
        <span>排気量</span>
        <input type="text" id="engineDisplacementInput" placeholder="例）1490">
      </label>
    </div>

    <div class="settingsPanel" data-panel="options" hidden>
      <label class="checkboxField">
        <input type="checkbox" id="saveOriginalCheckbox">
        <span>撮影時に元画像も写真アプリへ保存する</span>
      </label>
      <label class="checkboxField">
        <input type="checkbox" id="autoBackupCheckbox">
        <span>一覧に戻るたびに自動でバックアップ送信する（前回送信から一定時間が経っていた場合のみ）</span>
      </label>
    </div>

    <div class="settingsPanel" data-panel="other" hidden>
      <label class="field">
        <span>月次送信先メールアドレス（Boxのアップロード用）</span>
        <input type="email" id="boxEmailInput" inputmode="email" autocapitalize="off" autocorrect="off" placeholder="例）xxxxxxxx@u.box.com">
      </label>

      <label class="field">
        <span>テーマ</span>
        <select id="themeSelect">
          <option value="system">端末に合わせる</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
      </label>

      <div class="field">
        <span>全データのバックアップ（機種変更・不具合対策用）</span>
        <button id="exportAllBtn" class="ghostBtn">📦 全データをバックアップ</button>
        <button id="importAllBtn" class="ghostBtn">📥 バックアップから復元</button>
        <input type="file" id="importAllFileInput" accept="application/json" hidden>
      </div>
    </div>
  </div>
</div>

<div id="detailView" class="view" hidden>
  <header class="topbar">
    <button id="backBtn" class="navBtn" aria-label="戻る">◀ 戻る</button>
    <div class="periodLabel">
      <div id="detailDate">-</div>
    </div>
    <div style="width:2.5em"></div>
  </header>

  <div class="detailBody">
    <div class="photoRow">
      <div class="photoSlot">
        <div class="photoSlotLabel">開始距離の写真</div>
        <div class="photoBox" id="photoBoxStart">
          <img id="photoPreviewStart" hidden>
          <div id="photoPlaceholderStart" class="photoPlaceholder">タップして撮影／選択</div>
        </div>
        <div class="photoSlotActions">
          <button id="retakePhotoStartBtn" class="photoSlotAction" hidden>撮り直す</button>
          <button id="removePhotoStartBtn" class="photoSlotAction dangerText" hidden>削除</button>
        </div>
        <button id="saveOriginalStartBtn" class="ghostBtn saveOriginalBtn" hidden>📤 元画像を保存</button>
      </div>
      <div class="photoSlot">
        <div class="photoSlotLabel">終了距離の写真</div>
        <div class="photoBox" id="photoBoxEnd">
          <img id="photoPreviewEnd" hidden>
          <div id="photoPlaceholderEnd" class="photoPlaceholder">タップして撮影／選択</div>
        </div>
        <div class="photoSlotActions">
          <button id="retakePhotoEndBtn" class="photoSlotAction" hidden>撮り直す</button>
          <button id="removePhotoEndBtn" class="photoSlotAction dangerText" hidden>削除</button>
        </div>
        <button id="saveOriginalEndBtn" class="ghostBtn saveOriginalBtn" hidden>📤 元画像を保存</button>
      </div>
    </div>
    <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>

    <label class="field">
      <span>行き先・業務内容</span>
      <textarea id="destinationInput" rows="2" placeholder="例）通勤 / 自宅～現場名～会社～自宅"></textarea>
    </label>

    <div class="fieldRow">
      <label class="field">
        <span>開始距離（始針）</span>
        <input type="number" id="startInput" inputmode="decimal" step="0.1" placeholder="例）87604.0">
      </label>
      <label class="field">
        <span>終了距離（終針）</span>
        <input type="number" id="endInput" inputmode="decimal" step="0.1" placeholder="例）87620.0">
      </label>
    </div>

    <label class="checkboxField">
      <input type="checkbox" id="breakCheckbox">
      <span>中抜け（私用での移動）あり</span>
    </label>

    <div id="breakFieldRow" class="fieldRow" hidden>
      <label class="field">
        <span>再開距離（中抜け後の始針）</span>
        <input type="number" id="start2Input" inputmode="decimal" step="0.1" placeholder="例）87630.0">
      </label>
      <label class="field">
        <span>終了距離2（終針）</span>
        <input type="number" id="end2Input" inputmode="decimal" step="0.1" placeholder="例）87650.0">
      </label>
    </div>

    <div id="distanceSummary" class="summary"></div>
    <div id="warningBox" class="warningBox" hidden></div>
  </div>
</div>

<div id="saveToast" class="saveToast"></div>

<div id="lightbox" class="lightbox" hidden>
  <button id="lightboxCloseBtn" class="lightboxCloseBtn" aria-label="閉じる">✕</button>
  <img id="lightboxImg">
</div>

<script src="app.js?v=2"></script>
</body>
</html>
